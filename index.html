<!DOCTYPE html>

<html lang="en">

<head>
    <title>Kayleb Brown's Portfolio</title>
    <script src="index.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Redaction+20:ital,wght@0,400;0,700;1,400&family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>
    <header>
        <div class="socials">
        <b>Kayleb Brown's Portfoilo</b>
            <nav>
                <ul>
                    <li><a href="#github">Github</a></li>
                    <li><a href="#linkedin">Linkedin</a></li>
                </ul>
            </nav>
        </div>
    </header>

        <!-- I dont have any professial images i can use, but as soon as i get one ill replace them -->
        <section id="bio">
            <div class="bio-card">
                <h3>Biography</h3>
                <img src="images/3f04cd0e138cc716680962bf096ac8b3.jpg" alt="me" width="300px" height="300px" />
            </div>

            <div class="bio-text">
                <p>Hey, my name is Kayleb and im aspiring to be a Software Developer. I enjoy gaming, music, and
                    animals. I'm hopeing to be able to create great software and be sucessful in the field.</p>
            </div>
        </section>

        <section id="projects">
            <h3>My Projects</h3>
        </section>

        <section id="contact">
            <form method="POST" class="contact-form">
                <div class="input-row">
                    <div class="input-group">
                        <label for="first-name">First Name</label>
                        <input id="first-name" type="text" placeholder="First name" required/>
                    </div>
                    <div class="input-group">
                        <label for="last-name">Last Name</label>
                        <input id="last-name" type="text" placeholder="Last name" required/>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                       <label for="subject">Subject</label> 
                       <select id="subject">
                            <option value="business" selected>Business Inquiry</option>
                            <option value="feedback" selected>Feedback</option>
                            <option value="general" selected>General Question</option>
                       </select>                                                            
                    </div>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input id="email" type="text" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="message">Message Me.</label>
                    <textarea id="message" name="message" placeholder="Enter a message" required></textarea>
                </div>

                <button>Contact Me</button>
            </form>
        </section>
    </main>
    <footer>2024 copyright</footer>
</body>

</html>
